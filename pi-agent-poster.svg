<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 黑板纹理 -->
    <filter id="chalkboard">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.04" numOctaves="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.5" intercept="-0.75"/>
        <feFuncG type="linear" slope="1.5" intercept="-0.75"/>
        <feFuncB type="linear" slope="1.5" intercept="-0.75"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <!-- 粉笔字效果 -->
    <filter id="chalk">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 木框渐变 -->
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5c3a1e"/>
      <stop offset="30%" style="stop-color:#8b5e3c"/>
      <stop offset="60%" style="stop-color:#5c3a1e"/>
      <stop offset="100%" style="stop-color:#7a4e2a"/>
    </linearGradient>
    <!-- 黄粉笔 -->
    <filter id="chalkYellow" x="-10%" y="-10%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="noise" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 白粉笔 -->
    <filter id="chalkWhite">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" result="noise" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 粉笔盒投影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="3" flood-opacity="0.4" flood-color="#000"/>
    </filter>
  </defs>

  <!-- 木框 -->
  <rect x="0" y="0" width="800" height="600" fill="url(#woodGrain)"/>
  <!-- 内槽 -->
  <rect x="18" y="18" width="764" height="564" fill="#1a1a2e"/>
  <!-- 黑板区 -->
  <rect x="22" y="22" width="756" height="556" fill="#1e2d3d" filter="url(#chalkboard)"/>

  <!-- ==================== 橡皮屑/粉笔槽 ==================== -->
  <rect x="22" y="568" width="756" height="14" fill="#3a2418"/>
  <!-- 粉笔头散落 -->
  <ellipse cx="300" cy="575" rx="12" ry="5" fill="#f5e6c8" opacity="0.7"/>
  <ellipse cx="450" cy="572" rx="8" ry="4" fill="#f5e642" opacity="0.6"/>
  <ellipse cx="600" cy="576" rx="10" ry="4.5" fill="#f5e6c8" opacity="0.6"/>
  <ellipse cx="200" cy="573" rx="7" ry="3.5" fill="#f5e642" opacity="0.5"/>
  <ellipse cx="500" cy="574" rx="6" ry="3" fill="#f5e6c8" opacity="0.5"/>

  <!-- ==================== 顶部标题区 ==================== -->
  <!-- Pi 符号大图标 -->
  <text x="100" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="108" 
        fill="#f5e642" filter="url(#chalkYellow)" opacity="0.9" font-weight="bold">π</text>
  
  <!-- 标题 -->
  <text x="280" y="95" text-anchor="middle" font-family="cursive" font-size="52" 
        fill="#f0e8d0" filter="url(#chalkWhite)" font-weight="bold" letter-spacing="4">Pi Agent</text>
  
  <!-- 副标题 -->
  <text x="280" y="125" text-anchor="middle" font-family="cursive" font-size="18" 
        fill="#c8d0e0" filter="url(#chalk)">
    🤖 开源 AI 编码代理 · 自主软件工程师
  </text>

  <!-- 装饰曲线 -->
  <path d="M30,150 Q400,170 770,150" stroke="#7a6090" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M30,158 Q400,140 770,158" stroke="#6a5080" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- ==================== 左栏：核心工具 ==================== -->
  <!-- 栏目标题 -->
  <rect x="30" y="175" width="240" height="30" rx="4" fill="#2d4a5e" opacity="0.8"/>
  <text x="150" y="196" text-anchor="middle" font-family="cursive" font-size="20" 
        fill="#f5e642" filter="url(#chalkYellow)" font-weight="bold">🛠 核心工具</text>

  <!-- 工具列表 (tool icon + name) -->
  <g font-family="cursive" font-size="15" filter="url(#chalkWhite)" fill="#f0e8d0">
    <!-- bash -->
    <rect x="35" y="215" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="234">$</text><text x="65" y="234">bash</text>
    <text x="175" y="234" font-size="11" fill="#8aa0b0">终端 / 执行脚本</text>
    <!-- read -->
    <rect x="35" y="247" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="266">📄</text><text x="75" y="266">read</text>
    <text x="175" y="266" font-size="11" fill="#8aa0b0">解析任意文件</text>
    <!-- edit -->
    <rect x="35" y="279" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="298">✏️</text><text x="75" y="298">edit</text>
    <text x="175" y="298" font-size="11" fill="#8aa0b0">精准代码编辑</text>
    <!-- write -->
    <rect x="35" y="311" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="330">🖋️</text><text x="75" y="330">write</text>
    <text x="175" y="330" font-size="11" fill="#8aa0b0">覆盖写入文件</text>
    <!-- ace-tool -->
    <rect x="35" y="343" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="362">🔍</text><text x="75" y="362">ace</text>
    <text x="175" y="362" font-size="11" fill="#8aa0b0">语义代码搜索</text>
    <!-- visualize -->
    <rect x="35" y="375" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="394">💡</text><text x="75" y="394">visualize</text>
    <text x="175" y="394" font-size="11" fill="#8aa0b0">数据可视化</text>
    <!-- show_widget -->
    <rect x="35" y="407" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="426">🖼️</text><text x="75" y="426">show_widget</text>
    <text x="175" y="426" font-size="11" fill="#8aa0b0">生成交互式页面</text>
    <!-- agent -->
    <rect x="35" y="439" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="458">🧠</text><text x="75" y="458">Agent</text>
    <text x="175" y="458" font-size="11" fill="#8aa0b0">子代理委托</text>
    <!-- pi_messenger -->
    <rect x="35" y="471" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="490">📡</text><text x="75" y="490">pi_messenger</text>
    <text x="175" y="490" font-size="11" fill="#8aa0b0">智能体协作</text>
    <!-- session -->
    <rect x="35" y="503" width="220" height="28" rx="3" fill="#1e3a4a" opacity="0.7"/>
    <text x="52" y="522">💾</text><text x="75" y="522">session</text>
    <text x="175" y="522" font-size="11" fill="#8aa0b0">记忆 / 上下文管理</text>
  </g>

  <!-- ==================== 中间主区：核心能力 ==================== -->
  <!-- 栏目标题 -->
  <rect x="290" y="175" width="220" height="30" rx="4" fill="#2d4a5e" opacity="0.8"/>
  <text x="400" y="196" text-anchor="middle" font-family="cursive" font-size="20" 
        fill="#f5e642" filter="url(#chalkYellow)" font-weight="bold">⭐ 核心能力</text>

  <!-- 圆点列表 (能力点) -->
  <!-- item 1 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="225" r="4" fill="#f5e642"/>
    <text x="315" y="229" font-size="15" fill="#f0e8d0">自然语言 → 代码实现</text>
  </g>
  <!-- item 2 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="250" r="4" fill="#f5e642"/>
    <text x="315" y="254" font-size="15" fill="#f0e8d0">长期上下文记忆</text>
  </g>
  <!-- item 3 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="275" r="4" fill="#f5e642"/>
    <text x="315" y="279" font-size="15" fill="#f0e8d0">多步骤任务规划执行</text>
  </g>
  <!-- item 4 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="300" r="4" fill="#f5e642"/>
    <text x="315" y="304" font-size="15" fill="#f0e8d0">工具调用与沙盒执行</text>
  </g>
  <!-- item 5 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="325" r="4" fill="#f5e642"/>
    <text x="315" y="329" font-size="15" fill="#f0e8d0">Changelog / PR / Issue 管理</text>
  </g>
  <!-- item 6 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="350" r="4" fill="#f5e642"/>
    <text x="315" y="354" font-size="15" fill="#f0e8d0">Visualization: 图表 & 插图</text>
  </g>
  <!-- item 7 -->
  <g font-family="cursive" filter="url(#chalkWhite)">
    <circle cx="300" cy="375" r="4" fill="#f5e642"/>
    <text x="315" y="379" font-size="15" fill="#f0e8d0">Caveman 压缩输出模式</text>
  </g>
  <!-- item 8 -->
  <g font-family="cursive" filter="id(#chalkWhite)">
    <circle cx="300" cy="400" r="4" fill="#f5e642"/>
    <text x="315" y="404" font-size="15" fill="#f0e8d0">Parallel Agent 协作</text>
  </g>

  <!-- ==================== 中间下：流程图 ==================== -->
  <!-- 迷你流程示意图背景 -->
  <rect x="295" y="440" width="210" height="108" rx="6" fill="#2d4a5e" opacity="0.3"/>
  
  <g font-family="cursive" filter="url(#chalkWhite)" fill="#c8d8e8" text-anchor="middle">
    <rect x="300" y="448" width="200" height="22" rx="5" fill="#1a3a4a" opacity="0.8"/>
    <text x="400" y="463" font-size="13" fill="#d0e4f0">📥 接收任务指令</text>
    
    <text x="400" y="493" font-size="18" fill="#7a8a9a">↓ 思考 → 搜索 → 规划</text>
    
    <rect x="300" y="502" width="200" height="22" rx="5" fill="#1a3a4a" opacity="0.8"/>
    <text x="400" y="517" font-size="13" fill="#d0e4f0">🔧 工具调用执行</text>
    
    <text x="400" y="547" font-size="18" fill="#7a8a9a">↓ 读取 → 编辑 → 验证</text>
    
    <rect x="300" y="556" width="200" height="22" rx="5" fill="#1a4a3a" opacity="0.8"/>
    <text x="400" y="571" font-size="13" fill="#a0e8b0">✅ 输出结果 &amp; 记忆</text>
  </g>

  <!-- ==================== 右栏：特色功能与梗 ==================== -->
  <!-- 特色功能标题 -->
  <rect x="530" y="175" width="240" height="30" rx="4" fill="#2d4a5e" opacity="0.8"/>
  <text x="650" y="196" text-anchor="middle" font-family="cursive" font-size="20" 
        fill="#f5e642" filter="url(#chalkYellow)" font-weight="bold">🔥 特色 &amp; Steal</text>

  <!-- 特色列表 -->
  <g font-family="cursive" font-size="14" fill="#f0e8d0" filter="url(#chalkWhite)">
    <!-- caveman -->
    <rect x="535" y="213" width="230" height="34" rx="5" fill="#3a2a1a" opacity="0.6"/>
    <text x="550" y="226" font-size="13" fill="#f5e642" font-weight="bold">🦴 Caveman 模式</text>
    <text x="550" y="242" font-size="12" fill="#b0c0d0">75% token 压缩，碎片化输出</text>
    
    <!-- workspace -->
    <rect x="535" y="252" width="230" height="34" rx="5" fill="#1a3a4a" opacity="0.7"/>
    <text x="550" y="265" font-size="13" fill="#f5e642" font-weight="bold">📂 Workspace 目录</text>
    <text x="550" y="281" font-size="12" fill="#b0c0d0">项目级独立上下文</text>
    
    <!-- role 机制 -->
    <rect x="535" y="291" width="230" height="34" rx="5" fill="#2a1a3a" opacity="0.7"/>
    <text x="550" y="304" font-size="13" fill="#f5e642" font-weight="bold">🎭 Role 人格系统</text>
    <text x="550" y="320" font-size="12" fill="#b0c0d0">多角色记忆 &amp; 风格切换</text>
    
    <!-- session -->
    <rect x="535" y="330" width="230" height="34" rx="5" fill="#1a2a3a" opacity="0.7"/>
    <text x="550" y="343" font-size="13" fill="#f5e642" font-weight="bold">💾 Session 管理</text>
    <text x="550" y="359" font-size="12" fill="#b0c0d0">标签 / 检出 / 历史回溯</text>
    
    <!-- tab 陷阱 ⚠️ -->
    <rect x="535" y="369" width="230" height="34" rx="5" fill="#3a1a1a" opacity="0.7"/>
    <text x="550" y="382" font-size="13" fill="#ff6666">⚠️ Tab Snippet 陷阱</text>
    <text x="550" y="398" font-size="12" fill="#b0c0d0">不要信任“看似匹配”的片段</text>
    
    <!-- 间隔 -->
    <rect x="535" y="408" width="230" height="34" rx="5" fill="#1a3a2a" opacity="0.7"/>
    <text x="550" y="421" font-size="13" fill="#a0e8b0" font-weight="bold">✅ 验证优先原则</text>
    <text x="550" y="437" font-size="12" fill="#b0c0d0">执行 → 读取 → 再声明</text>
  </g>

  <!-- 右下角 Instruct 文字 -->
  <g font-family="monospace" font-size="11" fill="#607080" filter="url(#chalk)">
    <text x="540" y="565">Status: 🟢 Active · 2026-05-18</text>
    <text x="540" y="579">Model: grok-4.3 · Caveman: full</text>
  </g>

  <!-- ==================== 底部大 π 装饰 ==================== -->
  <text x="270" y="538" font-family="Georgia, serif" font-size="72" fill="#f5e642" 
        filter="url(#chalkYellow)" opacity="0.18" font-weight="bold">π</text>
  <text x="270" y="538" font-family="Georgia, serif" font-size="72" fill="#e8d858" 
        filter="url(#chalkYellow)" opacity="0.55" font-weight="bold">π</text>

  <!-- 顶部角落装饰 ：速度计 / 六边形 -->
  <g opacity="0.55">
    <!-- 左上角 uuid / id 装饰 -->
    <text x="30" y="80" font-family="monospace" font-size="10" fill="#40556a" filter="url(#chalk)">
      pi-agent://session/init v0.1.0
    </text>
    <!-- 右上角 git status 装饰 -->
    <text x="770" y="80" text-anchor="end" font-family="monospace" font-size="10" fill="#40556a" filter="url(#chalk)">
      [on main] HEAD -&gt; active
    </text>
  </g>

  <!-- 右上角 chalk dust ⭐ -->
  <g opacity="0.4">
    <path d="M760,195 L765,190 L770,200 Z" fill="#f5e642"/>
    <path d="M752,205 L757,200 L762,210 Z" fill="#f5e642"/>
    <path d="M768,210 L773,205 L778,215 Z" fill="#f5e642"/>
  </g>
</svg>
