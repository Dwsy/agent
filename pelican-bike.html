<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="纯 SVG 绘制的鹈鹕骑自行车 2D 循环动画。" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: light;
      --sky-top: #79cff8;
      --sky-bottom: #edfaff;
      --ink: #153241;
      --bike: #138d8b;
      --bike-dark: #0b6264;
      --coral: #f56f57;
      --orange: #f4a340;
      --cream: #fff9e9;
      --white: #fffdf8;
      --road: #65757c;
      --grass: #4e9b62;
      --seafoam: #e9ffff;
      --cycle: 1.05s;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 16px;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.72), transparent 34%),
        linear-gradient(180deg, #6fc7f0 0%, #dff6ff 58%, #f5fbfc 100%);
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
    }

    .scene-shell {
      position: relative;
      width: min(1180px, calc(100vw - 32px), calc(161.29vh - 51.61px));
      aspect-ratio: 1000 / 620;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.74);
      border-radius: 28px;
      background: #a9e2ff;
      box-shadow: 0 30px 80px rgba(30, 93, 113, .22), 0 4px 18px rgba(29, 80, 98, .12);
      isolation: isolate;
    }

    .scene-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), inset 0 -80px 110px rgba(18,48,61,.06);
      z-index: 3;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cloud-a { animation: drift-a 20s linear infinite; }
    .cloud-b { animation: drift-b 27s linear infinite; }
    .cloud-c { animation: drift-c 32s linear infinite; }
    .road-dashes { animation: road-flow .78s linear infinite; }
    .grass-streaks { animation: grass-flow .62s linear infinite; }
    .sea-sparkles { animation: sparkle-flow 4.8s ease-in-out infinite alternate; }
    .wind-lines { animation: wind-flow 2.2s linear infinite; }
    .speed-lines { animation: speed-flow .72s linear infinite; }
    .rider-bob { animation: rider-bob .525s ease-in-out infinite; transform-origin: 50% 72%; }
    .head-bob { animation: head-bob var(--cycle) ease-in-out infinite; transform-origin: 530px 178px; }
    .wing { animation: wing-pulse .525s ease-in-out infinite; transform-origin: 474px 250px; }
    .tail-feather { animation: tail-flick .525s ease-in-out infinite; transform-origin: 418px 264px; }
    .pouch { animation: pouch-sway var(--cycle) ease-in-out infinite; transform-origin: 570px 205px; }
    .crest { animation: crest-ripple var(--cycle) ease-in-out infinite; transform-origin: 548px 119px; }
    .eye-lid { animation: blink 4.6s ease-in-out infinite; transform-origin: 568px 139px; }
    .bell { animation: bell-swing .525s ease-in-out infinite; transform-origin: 604px 326px; }
    .shadow { animation: shadow-pulse .525s ease-in-out infinite; transform-origin: center; }

    @keyframes drift-a { from { transform: translateX(-170px); } to { transform: translateX(1120px); } }
    @keyframes drift-b { from { transform: translateX(80px); } to { transform: translateX(1300px); } }
    @keyframes drift-c { from { transform: translateX(-350px); } to { transform: translateX(980px); } }
    @keyframes road-flow { to { stroke-dashoffset: -94; } }
    @keyframes grass-flow { to { stroke-dashoffset: -76; } }
    @keyframes sparkle-flow { from { transform: translateX(-9px); opacity: .42; } to { transform: translateX(13px); opacity: .88; } }
    @keyframes wind-flow { from { transform: translateX(0); opacity: 0; } 20% { opacity: .38; } to { transform: translateX(-155px); opacity: 0; } }
    @keyframes speed-flow { to { transform: translateX(-78px); } }
    @keyframes rider-bob { 0%, 100% { transform: translateY(0) rotate(.12deg); } 50% { transform: translateY(-4px) rotate(-.12deg); } }
    @keyframes head-bob { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.8deg); } }
    @keyframes wing-pulse { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-4.5deg); } }
    @keyframes tail-flick { 0%, 100% { transform: rotate(1deg); } 50% { transform: rotate(-5deg); } }
    @keyframes pouch-sway { 0%, 100% { transform: rotate(0deg) scaleY(1); } 50% { transform: rotate(1.2deg) scaleY(1.018); } }
    @keyframes crest-ripple { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(-7deg); } }
    @keyframes blink { 0%, 44%, 47%, 100% { transform: scaleY(1); } 45.5%, 46.2% { transform: scaleY(.08); } }
    @keyframes bell-swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes shadow-pulse { 0%, 100% { transform: scaleX(1); opacity: .18; } 50% { transform: scaleX(.955); opacity: .13; } }

    .title-card {
      position: absolute;
      inset: 28px auto auto 30px;
      z-index: 2;
      min-width: 246px;
      padding: 14px 17px 15px;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 19px;
      background: linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.44));
      box-shadow: 0 12px 34px rgba(27, 93, 119, .11);
      backdrop-filter: blur(12px) saturate(120%);
      color: var(--ink);
      pointer-events: none;
    }

    .title-card::before {
      content: "";
      display: block;
      width: 34px;
      height: 4px;
      margin-bottom: 10px;
      border-radius: 99px;
      background: var(--coral);
    }

    .title-card strong {
      display: block;
      font-size: clamp(16px, 2vw, 21px);
      letter-spacing: .055em;
    }

    .title-card span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: .02em;
      opacity: .66;
    }

    .title-card small {
      display: block;
      margin-top: 9px;
      font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      opacity: .42;
    }

    @media (max-width: 720px) {
      body { padding: 0; }
      .scene-shell { width: 100vw; max-height: 100vh; border-radius: 0; border: 0; }
      .title-card { inset: 16px auto auto 16px; min-width: 0; padding: 11px 13px 12px; }
      .title-card small { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
      svg animate, svg animateTransform { display: none; }
    }
  </style>
</head>
<body>
  <main class="scene-shell" aria-label="鹈鹕骑自行车的二维动画">
    <div class="title-card" aria-hidden="true">
      <strong>PELICAN PEDAL CLUB</strong>
      <span>海风、单车，还有一只很认真的鹈鹕。</span>
      <small>COASTAL LOOP · 01</small>
    </div>

    <svg viewBox="0 0 1000 620" role="img" aria-labelledby="scene-title scene-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="scene-title">鹈鹕骑自行车动画</title>
      <desc id="scene-desc">一只白色鹈鹕骑着蓝绿色自行车沿海边公路前进，车轮、脚踏、腿部、羽翼与背景都有循环动画。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#83d4ff" />
          <stop offset=".72" stop-color="#dcf5ff" />
          <stop offset="1" stop-color="#f6fcff" />
        </linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#60c5d5" />
          <stop offset="1" stop-color="#83dcd7" />
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffc96f" />
          <stop offset="1" stop-color="#f4a340" />
        </linearGradient>
        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fffefb" />
          <stop offset="1" stop-color="#dde9eb" />
        </linearGradient>
        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="7" />
        </filter>
        <filter id="sunGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="13" />
        </filter>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7f9197" />
          <stop offset="1" stop-color="#5f7078" />
        </linearGradient>
        <linearGradient id="frameGrad" x1="350" y1="330" x2="665" y2="455" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#20a5a0" />
          <stop offset=".58" stop-color="#138d8b" />
          <stop offset="1" stop-color="#087276" />
        </linearGradient>
        <pattern id="roadGrain" width="34" height="34" patternUnits="userSpaceOnUse">
          <circle cx="5" cy="7" r="1.1" fill="#ffffff" opacity=".11" />
          <circle cx="24" cy="19" r=".8" fill="#17323b" opacity=".1" />
          <circle cx="12" cy="29" r=".7" fill="#ffffff" opacity=".08" />
        </pattern>
        <clipPath id="roadClip">
          <rect x="0" y="470" width="1000" height="150" />
        </clipPath>
      </defs>

      <!-- Background -->
      <rect width="1000" height="620" fill="url(#sky)" />
      <circle cx="833" cy="104" r="62" fill="#ffe69b" opacity=".32" filter="url(#sunGlow)" />
      <circle cx="833" cy="104" r="43" fill="#fff0a8" />
      <circle cx="820" cy="91" r="12" fill="#fff8c9" opacity=".72" />

        <path d="M730 183 q12 -11 24 0 q12 -11 24 0" />
        <path d="M788 212 q9 -8 18 0 q9 -8 18 0" />
      </g>

      <g fill="#fff" opacity=".9">

        </g>

        <g class="cloud-c" transform="translate(-350 0)" opacity=".6">

          <circle cx="131" cy="79" r="12" />
        </g>

      <!-- Far coast -->

        <path d="M468 402 h24 M546 421 h42 M630 397 h21" opacity=".38" />
      </g>

      <g opacity=".42">

        <path d="M106 398 h34" stroke="#315e54" stroke-width="8" stroke-linecap="round" />
      </g>

      <g class="wind-lines" fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".34">

      <!-- Road -->
      <path d="M0 455 C168 441 328 448 497 454 C665 460 830 452 1000 438 L1000 620 L0 620Z" fill="url(#roadGrad)" />
      <path d="M0 455 C168 441 328 448 497 454 C665 460 830 452 1000 438 L1000 620 L0 620Z" fill="url(#roadGrain)" />
      <path d="M0 473 C238 460 457 474 676 470 C792 468 899 459 1000 451" fill="none" stroke="#edf1e4" stroke-width="8" opacity=".9" />

      <ellipse class="shadow" cx="512" cy="515" rx="208" ry="18" fill="#233942" filter="url(#softShadow)" />

      <!-- Rider + bicycle -->
      <g class="rider-bob">
        <!-- Wheels -->
        <g transform="translate(353 456)">
          <circle r="78" fill="#f7fcfb" stroke="#233942" stroke-width="8" />
          <circle r="65" fill="none" stroke="#9cb4b8" stroke-width="2.5" />
          <g stroke="#8aa5aa" stroke-width="2.4">
            <g>
              <line x1="-62" y1="0" x2="62" y2="0" />

          <circle r="8" fill="#233942" />

        <g transform="translate(668 456)">
          <circle r="78" fill="#f7fcfb" stroke="#233942" stroke-width="8" />
          <circle r="65" fill="none" stroke="#9cb4b8" stroke-width="2.5" />
          <g stroke="#8aa5aa" stroke-width="2.4">
            <g>
              <line x1="-62" y1="0" x2="62" y2="0" />
              <line x1="0" y1="-62" x2="0" y2="62" />
              <line x1="-44" y1="-44" x2="44" y2="44" />
              <line x1="44" y1="-44" x2="-44" y2="44" />
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite" />
            </g>
          </g>
          <circle r="8" fill="#233942" />

        <!-- Bicycle frame -->

        <!-- Neck + head -->

          <g class="eye-lid">

          <!-- Beak and pouch -->
          <path d="M579 151 C624 145 676 147 727 158 C683 168 630 172 580 170Z" fill="#f5b44b" stroke="#cd8231" stroke-width="3.5" />
          <g class="pouch">
            <path d="M582 169 C635 166 686 166 724 158 C704 204 666 226 620 220 C595 217 584 197 582 169Z" fill="url(#pouchGrad)" stroke="#cf8732" stroke-width="3.5" />
