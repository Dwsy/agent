  --sdk-card-min: 330px;

html,
body,
#root {
  width: 100%;
  height: 100%;
  margin: 0;
}

html { background: transparent; }
body { overflow: hidden; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; }

.sdk-shell {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  background: transparent;
}

html[data-audit-locked="true"] .sdk-shell {
  pointer-events: none;
  user-select: none;
}

.sdk-sidebar {
  min-width: 0;
  transition:
    margin 180ms cubic-bezier(0.165, 0.84, 0.44, 1),
    width 180ms cubic-bezier(0.165, 0.84, 0.44, 1),
    height 180ms cubic-bezier(0.165, 0.84, 0.44, 1),
    border-radius 180ms cubic-bezier(0.165, 0.84, 0.44, 1),
    box-shadow 180ms cubic-bezier(0.165, 0.84, 0.44, 1);
}

.sdk-sidebar--attached {
  width: 100%;
  height: 100%;
  margin: 0;
  border: 0 solid transparent;
  border-radius: 0;
  box-shadow: none;
}

.sdk-sidebar--floating {
  width: calc(100% - 24px);
  height: calc(100% - 24px);
  margin: 12px;
  overflow: hidden;
  border: 1px solid var(--color-border-tertiary);
  border-radius: 18px;
  box-shadow: var(--shadow-popover);
}

.sdk-sidebar--floating .bg-glass-sidebar {
  border-radius: 18px;
}


/* SplitView's pinned toggle portal is positioned in the outer window frame,
   not inside the sidebar DOM. Follow the floating panel's 12px inset so the
   whole portal (button + separately centered icon) clears its rounded edge. */
.sdk-shell--sidebar-floating > [aria-hidden="true"]:has([data-audit-target="sidebar-toggle"]) {
  transform: translateX(12px);
}

/* Keep the SDK's 52px pinned slot center (y=26) aligned with the native
   traffic lights. A 28px pill starts at y=12, clearing the floating edge
   without moving the button's centerline. */
.sdk-shell--sidebar-floating [data-audit-target="sidebar-toggle"] {
  width: 28px !important;
  height: 28px !important;
  min-width: 28px !important;
}
.sdk-sidebar-footer {
  display: grid;
  gap: 2px;
  padding: 8px 10px;
  color: var(--color-text-tertiary);
  font-size: var(--text-small, 11px);
}
.sdk-sidebar-footer strong {
  color: var(--color-text-secondary);
  font-weight: 600;
}

.sdk-workspace {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
}

.drag-region {
  -webkit-app-region: drag;
}

.drag-region button,
.drag-region input,
.drag-region select,
.drag-region textarea,
.drag-region [role="button"],
.drag-region [role="radio"],
.drag-region [role="combobox"],
.drag-region [contenteditable="true"] {
  -webkit-app-region: no-drag;
}

.sdk-toolbar-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  min-width: 0;
  -webkit-app-region: no-drag;
}

.sdk-content {
  min-height: 100%;
  padding: 18px 20px 28px;
}

.sdk-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--sdk-card-min)), 1fr));
  gap: 24px var(--sdk-shell-gap);
  align-items: start;
}

.sdk-sample-group {
  min-width: 0;
  display: grid;
  align-content: start;
}
.sdk-card--wide { grid-column: 1 / -1; }
.sdk-sample-group__header {
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px 9px;

.sdk-sample-group__header h2 {

.sdk-row {

  grid-template-columns: 92px minmax(0, 1fr);
  gap: 12px;
  align-items: center;

.sdk-row__label {
  color: var(--color-text-secondary);
  font-size: var(--text-small, 11px);
}
.sdk-row__controls,
.sdk-native-summary,
.sdk-footer {
  display: flex;
  align-items: center;
}
.sdk-row__controls {
  min-width: 0;
  flex-wrap: wrap;
  gap: 8px;
}
.sdk-flex-fill { min-width: 180px; flex: 1; }
.sdk-type-stack { display: grid; gap: 4px; }

.sdk-inset,
.sdk-context-target,
.sdk-contract-note,
.sdk-native-summary {
  border-radius: var(--radius-control);
  background: var(--color-surface-well);
  border: 1px solid var(--color-border-tertiary);
}
.sdk-inset { margin-top: 9px; padding: 11px; color: var(--color-text-secondary); }
.sdk-context-target {
  min-height: 112px;
  display: grid;
  place-items: center;
  color: var(--color-text-secondary);
  user-select: none;
}
.sdk-contract-note { padding: 12px; }
.sdk-contract-note p,
.sdk-native-summary p {
  margin: 8px 0 0;
  color: var(--color-text-secondary);
  line-height: 1.45;
}

.sdk-floating-sidebar-demo {
  height: 286px;
  overflow: hidden;
  border: 1px solid var(--color-border-tertiary);
  border-radius: 18px;
  background: color-mix(in srgb, var(--color-background) 64%, transparent);
}

.sdk-floating-sidebar-panel { min-width: 0; }

.sdk-floating-sidebar-content {
  display: grid;
  align-content: center;
  justify-items: start;
  gap: 10px;
  min-height: 214px;
  padding: 24px;
  color: var(--color-text-secondary);
}

.sdk-floating-sidebar-content p {
  max-width: 440px;
  margin: 0;
  line-height: 1.55;
}

.sdk-panel-group {
  height: 170px;
  overflow: hidden;
}
.sdk-panel { height: 100%; padding: 12px; }
.sdk-scroll { height: 100%; }
.sdk-demo-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sdk-inspector-frame { height: 250px; overflow: hidden; }

.sdk-native-summary {
  align-items: flex-start;
  flex-direction: column;
  padding: 12px;
}
.sdk-contract-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 8px;
}
.sdk-contract {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) auto;
  gap: 9px;
  align-items: center;
  min-height: 42px;
  padding: 8px 10px;
  border-radius: var(--radius-control);
  background: var(--color-surface-well);
  border: 1px solid var(--color-border-tertiary);
}
.sdk-contract span { color: var(--color-text-secondary); font-size: var(--text-small, 11px); }

.sdk-family-matrix {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 7px;
}
.sdk-family {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 34px;
  padding: 6px 8px;
  border-radius: var(--radius-8);
  background: var(--color-surface-well);
  border: 1px solid var(--color-border-tertiary);
}
.sdk-family > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sdk-footer {
  width: 100%;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px 16px;
  color: var(--color-text-secondary);
  font-size: var(--text-small, 11px);
}
.sdk-footer strong { color: var(--color-text-primary); }
.sdk-ok { color: var(--support-green-80); }
.sdk-warning { color: var(--support-orange-80); }
.sdk-error-detail { overflow: auto; user-select: text; white-space: pre-wrap; }

/* Compatibility only: the installed SDK owns every control state. This block
   supplies a substrate only when WebKit does not expose -apple-visual-effect. */
@supports not (-apple-visual-effect: -apple-system-glass-material) {
  .bg-glass,
  .bg-glass-sidebar,
  .bg-glass-toast,
  .bg-glass-accent {
    -webkit-backdrop-filter: blur(var(--blur-panel)) saturate(1.2);
    backdrop-filter: blur(var(--blur-panel)) saturate(1.2);
    border-color: var(--color-border-secondary);
    box-shadow: inset 0 1px 0 var(--color-border-tertiary);
  }
  .bg-glass:not(:hover):not(:active):not(:focus-visible):not([data-state="open"]),
  .bg-glass-sidebar:not(:hover):not(:active),
  .bg-glass-toast:not(:hover):not(:active) {

@media (prefers-reduced-transparency: reduce) {

  .bg-glass-sidebar,
  .bg-glass-toast,

  .sdk-footer { justify-content: flex-start; }

<script id="sdk-gallery-loader">(async function(){
  try{
    const raw=atob(document.getElementById('sdk-gallery-payload').textContent.trim());
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const code=await new Response(stream).text();
    (0,eval)(code+'\n//# sourceURL=glaze-sdk-gallery.iife.js');
  }catch(error){
    (window.__SDK_GALLERY_ERRORS__||[]).push({kind:'loader',message:String(error&&error.stack||error),time:new Date().toISOString()});
    const root=document.getElementById('root');
    if(root)root.textContent='Glaze SDK Gallery failed to load: '+String(error);
  }
})();</script>

<script id="glaze-kit-native-glass">
(() => {
  "use strict";

  const root = document.documentElement;
  const state = {
    requested: false,
    supported: null,
    background: false,
    ids: [],
    regionCount: 0,
    lastSignature: "",
    dragSignature: "",
    dragCount: 0,
    noDragCount: 0,
    lastSyncAt: null,
  };
  let frame = 0;
  let sequence = 0;
  let previouslyBound = new Set();
  const observedGeometry = new WeakSet();
  const geometryObserver = new ResizeObserver(schedule);

  const isDark = () => root.classList.contains("dark");
  const darkBackgroundTintAlpha = 0.58;
  const lightBackgroundTintAlpha = 0.16;
  const bridge = () => window.glimpse && typeof window.glimpse.setNativeGlassRegions === "function"
    ? window.glimpse
    : null;

  function visibleRect(element, requireFullyVisible = false) {
    const rect = element.getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2 || rect.bottom <= 0 || rect.right <= 0 || rect.top >= innerHeight || rect.left >= innerWidth) return null;
    const content = document.querySelector(".sdk-content");
    if (requireFullyVisible && content && content.contains(element)) {
      const clip = content.getBoundingClientRect();
      if (rect.top < clip.top || rect.bottom > clip.bottom || rect.left < clip.left || rect.right > clip.right) return null;
    }
    return rect;
  }

  function radiusFor(element, rect) {
    const raw = parseFloat(getComputedStyle(element).borderRadius || "0");
    return Math.max(0, Math.min(Number.isFinite(raw) ? raw : 0, rect.width / 2, rect.height / 2));
  }

  function tintAlpha(kind, element) {
    if (kind === "background") return isDark() ? darkBackgroundTintAlpha : lightBackgroundTintAlpha;
    if (kind === "sidebar") return isDark() ? 0.18 : 0.1;
    if (kind === "overlay") return isDark() ? 0.18 : 0.12;
    const auditTarget = element.getAttribute("data-audit-target");
    const isSidebarToggle = auditTarget === "sidebar-toggle" || auditTarget === "floating-sidebar-toggle";
    if (element.matches(":active") || element.getAttribute("data-state") === "open") return 0.18;
    if (element.matches(":hover")) return isSidebarToggle ? 0.18 : 0.12;
    if (isSidebarToggle) return isDark() ? 0.1 : 0.07;
    return 0;
  }

  function region(id, kind, element, rect) {
    const hovered = kind !== "background" && element.matches(":hover");
    const pressed = kind !== "background" && (element.matches(":active") || element.getAttribute("data-state") === "open");
    const computed = getComputedStyle(element);
    return {
      id,
      role: kind,
      x: Math.round(rect.x * 2) / 2,
      y: Math.round(rect.y * 2) / 2,
      width: Math.round(rect.width * 2) / 2,
      height: Math.round(rect.height * 2) / 2,
      cornerRadius: kind === "background" ? 0 : radiusFor(element, rect),
      style: "regular",
      tintWhite: (kind === "background" || kind === "sidebar" || kind === "overlay") && isDark() ? 0 : 1,
      tintAlpha: tintAlpha(kind, element),
      foregroundColor: computed.color,
      backgroundColor: computed.backgroundColor,
      hovered,
      pressed,
      adaptiveAppearance: 1,
      interactive: false,
    };
  }

  function stableId(element, prefix, index) {
    if (element.dataset.nativeGlassId) return element.dataset.nativeGlassId;
    const family = element.getAttribute("data-sdk-family") || element.getAttribute("data-audit-target") || element.getAttribute("data-slot") || element.getAttribute("role") || "surface";
    const safe = family.toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-|-$/g, "").slice(0, 52) || "surface";
    element.dataset.nativeGlassId = `${prefix}-${safe}-${index}`;
    return element.dataset.nativeGlassId;
  }

  function collect() {
    const regions = [region(
      "gallery-background",
      "background",
      root,
      { x: 0, y: 0, width: innerWidth, height: innerHeight },
    )];
    const bound = new Set();
    const sidebarMaterials = Array.from(document.querySelectorAll(".bg-glass-sidebar"));
    let sidebarIndex = 0;
    for (const material of sidebarMaterials) {
      material.dataset.nativeGlassBound = "true";
      material.dataset.nativeGlassKind = "sidebar";
      bound.add(material);
      const sidebarRoot = material.closest(".sdk-sidebar, .sdk-floating-sidebar-panel") || material.parentElement;
      const panel = sidebarRoot?.closest("[data-panel-index]");
      for (const observed of [panel, sidebarRoot]) {
        if (observed && !observedGeometry.has(observed)) {
          observedGeometry.add(observed);
          geometryObserver.observe(observed);
        }
      }
      const floatingMainSidebar = sidebarRoot?.classList.contains("sdk-sidebar--floating") === true;
      const rectTarget = floatingMainSidebar ? sidebarRoot : (panel || sidebarRoot);
      const rect = rectTarget ? visibleRect(rectTarget) : null;
      if (!rect || rect.width > 520 || rect.height < 40) continue;
      regions.push(region(stableId(material, "gallery-sidebar", sidebarIndex++), "sidebar", material, rect));
    }

    const controls = Array.from(document.querySelectorAll(
      ".bg-glass, .bg-glass-accent, .bg-glass-toast, [data-audit-target=\"glass-button\"], [data-audit-target=\"glass-accent-button\"], [data-audit-target=\"toggle-on\"], [data-audit-target=\"sidebar-toggle\"], [data-audit-target=\"floating-sidebar-toggle\"]"
    ));
    let controlIndex = 0;
    for (const control of controls) {
      if (regions.length >= 24) break;
      if (bound.has(control)) continue;
      const auditedSidebarToggle = control.closest('[data-audit-target="sidebar-toggle"], [data-audit-target="floating-sidebar-toggle"]');
      if (control.matches(".bg-glass") && auditedSidebarToggle && auditedSidebarToggle !== control) continue;
      const rect = visibleRect(control, true);
      if (!rect || rect.width > 520 || rect.height > 180) continue;
      control.dataset.nativeGlassBound = "true";
      control.dataset.nativeGlassKind = "control";
      bound.add(control);
      regions.push(region(stableId(control, "gallery-control", controlIndex++), "control", control, rect));
    }

    const overlays = Array.from(document.querySelectorAll(
      '[role="dialog"], [role="menu"], [role="listbox"], [data-slot="custom-select-content"], [data-radix-popper-content-wrapper] > *'
    ));
    let overlayIndex = 0;
    for (const overlay of overlays) {
      if (regions.length >= 32) break;
      if (bound.has(overlay) || overlay.closest(".sdk-sidebar")) continue;
      const rect = visibleRect(overlay);
      if (!rect || rect.width < 40 || rect.height < 24) continue;
      overlay.dataset.nativeGlassBound = "true";
      overlay.dataset.nativeGlassKind = "overlay";
      bound.add(overlay);
      regions.push(region(stableId(overlay, "gallery-overlay", overlayIndex++), "overlay", overlay, rect));
    }

    for (const element of previouslyBound) {
      if (!bound.has(element) && element.isConnected) {
        delete element.dataset.nativeGlassBound;
        delete element.dataset.nativeGlassKind;
      }
    }
    previouslyBound = bound;
    return regions;
  }

  function rectPayload(rect) {
    return {
      x: Math.round(rect.x * 2) / 2,
      y: Math.round(rect.y * 2) / 2,
      width: Math.round(rect.width * 2) / 2,
      height: Math.round(rect.height * 2) / 2,
    };
  }

  function rectsOverlap(left, right) {
    return left.left < right.right && left.right > right.left && left.top < right.bottom && left.bottom > right.top;
  }

  function collectWindowDragRegions() {
    const drag = [];
    const dragRects = [];
    const noDrag = [];
    const selector = '.sdk-toolbar-controls, button, input, select, textarea, a, [role="button"], [role="radio"], [role="combobox"], [contenteditable="true"]';
    for (const element of Array.from(document.querySelectorAll('.drag-region')).slice(0, 8)) {
      const rect = visibleRect(element);
      if (!rect) continue;
      dragRects.push(rect);
      drag.push(rectPayload(rect));
    }
    for (const excluded of Array.from(document.querySelectorAll(selector))) {
      if (noDrag.length >= 32) break;
      const excludedRect = visibleRect(excluded);
      if (!excludedRect || !dragRects.some((dragRect) => rectsOverlap(dragRect, excludedRect))) continue;
      noDrag.push(rectPayload(excludedRect));
    }
    return { drag, noDrag };
  }

  function patchGallerySnapshot() {
    const api = window.__GLAZE_SDK_GALLERY__;
    if (!api || api.__glazeKitNativePatched || typeof api.snapshot !== "function") return;
    const original = api.snapshot.bind(api);
    api.snapshot = () => ({ ...original(), nativeMaterial: { ...state } });
    api.__glazeKitNativePatched = true;
  }

  function updateFooter() {
    const status = document.querySelector(".sdk-footer .sdk-warning, .sdk-footer .sdk-ok");
    if (!status) return;
    if (state.supported && state.background) {
      status.textContent = `Native AppKit Liquid Glass background · ${Math.max(0, state.regionCount - 1)} local regions`;
      status.classList.remove("sdk-warning");
      status.classList.add("sdk-ok");
    } else if (state.supported) {
      status.textContent = state.regionCount
        ? `Native AppKit frosted window · ${state.regionCount} local regions`
        : "Native AppKit frosted window";
      status.classList.remove("sdk-warning");
      status.classList.add("sdk-ok");
    } else if (state.supported === false) {
      status.textContent = "Frosted Web fallback";
    }
  }

  function sync() {
    frame = 0;
    patchGallerySnapshot();
    const host = bridge();
    if (!host) {
      root.classList.add("native-liquid-glass-unavailable");
      return;
    }
    const dragRegions = collectWindowDragRegions();
    const dragSignature = JSON.stringify(dragRegions);
    if (dragSignature !== state.dragSignature && typeof host.setWindowDragRegions === "function") {
      state.dragSignature = dragSignature;
      state.dragCount = dragRegions.drag.length;
      state.noDragCount = dragRegions.noDrag.length;
      host.setWindowDragRegions(dragRegions);
      try {
        window.GappStore?.set?.({
          windowDragDiagnostics: {
            requested: true,
            dragCount: state.dragCount,
            noDragCount: state.noDragCount,
            regions: dragRegions,
          },
        });
      } catch {}
    }
    const regions = collect();
    const signature = JSON.stringify(regions);
    if (signature === state.lastSignature) return;
    state.lastSignature = signature;
    state.requested = true;
    state.regionCount = regions.length;
    state.ids = regions.map((item) => item.id);
    state.lastSyncAt = new Date().toISOString();
    host.setNativeGlassRegions(regions);
    window.__GLAZE_KIT_NATIVE_MATERIAL__ = state;
    try {
      window.GappStore?.set?.({
        nativeMaterialDiagnostics: {
          requested: true,
          lastSyncAt: state.lastSyncAt,
          regions,
        },
      });
    } catch {}
  }

  function schedule() {
    if (!frame) frame = requestAnimationFrame(sync);
  }

  window.addEventListener("gapp-window-drag-applied", (event) => {
    const detail = event.detail || {};
    state.dragCount = Number(detail.dragCount) || 0;
    state.noDragCount = Number(detail.noDragCount) || 0;
    try {
      window.GappStore?.set?.({
        windowDragDiagnostics: {
          requested: true,
          applied: true,
          dragCount: state.dragCount,
          noDragCount: state.noDragCount,
          regions: collectWindowDragRegions(),
        },
      });
    } catch {}
  });

  window.addEventListener("gapp-native-glass-applied", (event) => {
    const detail = event.detail || {};
    state.supported = !!detail.supported;
    state.background = !!detail.background;
    state.ids = Array.isArray(detail.ids) ? detail.ids : state.ids;
    state.regionCount = Number(detail.count) || state.ids.length;
    root.classList.toggle("native-window-material", state.supported);
    root.classList.toggle("native-liquid-glass", state.supported && state.regionCount > 0);
    root.classList.toggle("native-liquid-glass-unavailable", !state.supported);
    root.dataset.nativeGlassRegions = String(state.regionCount);
    window.__GLAZE_KIT_NATIVE_MATERIAL__ = state;
    try {
      window.GappStore?.set?.({
        nativeMaterialDiagnostics: {
          requested: state.requested,
          supported: state.supported,
          background: state.background,
          regionCount: state.regionCount,
          ids: state.ids,
          lastSyncAt: state.lastSyncAt,
          regions: collect(),
        },
      });
    } catch {}
    patchGallerySnapshot();
    updateFooter();
  });

  addEventListener("resize", schedule, { passive: true });
  addEventListener("scroll", schedule, { passive: true, capture: true });
  for (const type of ["pointerover", "pointerout", "pointerdown", "pointerup", "focusin", "focusout"]) {
    document.addEventListener(type, schedule, true);
  }
  new MutationObserver(schedule).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["class", "data-theme-mode", "data-gallery-section", "data-style-profile"],
  });
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  new ResizeObserver(schedule).observe(document.documentElement);

  addEventListener("beforeunload", () => {
    const host = bridge();
    host?.setNativeGlassRegions([]);
    host?.setWindowDragRegions?.({ drag: [], noDrag: [] });
  });
  const boot = setInterval(() => {
    sequence += 1;
    patchGallerySnapshot();
    schedule();
    if (state.supported !== null || sequence > 120) clearInterval(boot);
  }, 50);
  schedule();
})();
</script>
</body>
</html>
