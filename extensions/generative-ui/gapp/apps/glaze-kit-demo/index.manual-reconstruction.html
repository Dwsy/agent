  <style>
    :root { --background: hsl(0 0% 100% / .9); color-scheme: light dark; }
    .dark { --background: hsl(0 0% 0% / .4); }
    * { box-sizing: border-box; }
    html, body, #app { width:100%; height:100%; margin:0; }
    body { background:var(--background); overflow:hidden; user-select:none; }
    button, input { font:inherit; }
    button { cursor:default; }
    input { user-select:text; }
    .rm-toolbar {
      position:relative; display:flex; align-items:center; min-height:52px; height:52px;
      padding:0 10px; border-bottom:1px solid var(--color-separator, rgb(from var(--fg) r g b / 10%));
    }
    .rm-toolbar-center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); }
    .rm-toolbar-actions { margin-left:auto; display:flex; align-items:center; }
    .rm-mode-button, .rm-frame-button {
      border:1px solid transparent; color:var(--color-primary, var(--fg));
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      height:28px; border-radius:var(--radius-control); padding:0 10px;
      background:var(--color-glass, rgb(from var(--bg) r g b / 45%));
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    }
    .rm-mode-button { width:96px; }
    .rm-frame-button { width:28px; padding:0; }
    .rm-mode-button:active, .rm-frame-button:active, .rm-preset-button:active { opacity:.65; }
    .rm-main { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; gap:24px; padding:8px 24px 32px; }
